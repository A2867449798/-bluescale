name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o bluescale.zip -d src_unzip
          echo "--- 结构 ---"
          find src_unzip -name settings.gradle

      - name: Locate project
        run: |
          DIR=$(dirname "$(find src_unzip -name settings.gradle | head -1)")
          echo "PROJ_DIR=$DIR" >> $GITHUB_ENV
          echo "工程位置: $DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJ_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueScale-apk
          path: src_unzip/**/*.apk

      - name: Show result
        run: find src_unzip -name "*.apk" -exec ls -lh {} \;
